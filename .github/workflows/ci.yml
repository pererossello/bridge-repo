name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]


jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # Installs Python 3.12 on the VM
      - name: Set up Python  
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" 


        # Caches pip packages based on pyproject.toml and requirements.txt files
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install package with dev extras
        run: |
          pip install -e .[dev]
          python -c "import bridge; print('Imported bridge OK')"

      - name: Lint (ruff) and format check (black)
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: pytest -q --maxfail=1

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify clean install of built wheel
        run: |
          python -m venv .pkgcheck
          . .pkgcheck/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -c "import bridge; print('Wheel import OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-dist
          path: dist/*
