[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bridge"
version = "0.1.0"
description = "Fast and approximate large-scale simulations for Bayesian inference of galaxy redshift survey data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pererossello", email = "per.rossello@gmail.com" }]
requires-python = ">=3.12,<4.0"

dependencies = [
  "numpy>=2.3.2,<3.0.0",
  "matplotlib>=3.10.3,<4.0.0",
  "scipy>=1.16.1,<2.0.0",
  "h5py>=3.14.0,<4.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "typer>=0.16.0,<0.17.0",
  "jax>=0.7.0,<0.8.0",
  "numpyro>=0.19.0,<0.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "pytest-cov>=6.2.1,<7.0.0",
  "black>=25.1.0,<26.0.0",
  "ruff>=0.12.5,<0.13.0",
  "mypy>=1.17.0,<2.0.0",
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocstrings[python]>=0.30.0,<0.31.0",
  "hypothesis>=6.136.6,<7.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "ipykernel>=6.30.0,<7.0.0"
]
gpu = ["jax[cuda12]>=0.7,<0.8"]
docs = [
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-material>=9.6.16,<10.0.0",
  "mkdocstrings[python]>=0.30.0,<0.31.0",
  "mkdocs-autorefs>=1.4.2,<2.0.0"
]

[project.scripts]
bridge = "bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]   # ← this is the Hatchling way

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
exclude = ["notebooks"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = "src"
ignore_missing_imports = true
